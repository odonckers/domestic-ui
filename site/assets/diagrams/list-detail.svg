<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-list-detail-title" aria-describedby="diagram-list-detail-desc">
  <title id="diagram-list-detail-title">Where list-detail is used</title>
  <desc id="diagram-list-detail-desc">List-detail splits the content area into a list of items and, beside it, the details of the selected one.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="64" width="52" height="6" rx="2"/>
    <rect x="100" y="84" width="52" height="6" rx="2"/>
    <rect x="100" y="104" width="52" height="6" rx="2"/>
    <rect x="100" y="124" width="52" height="6" rx="2"/>
    <rect x="100" y="144" width="52" height="6" rx="2"/>
    <rect x="186" y="64" width="80" height="10" rx="2" fill-opacity=".6"/>
    <rect x="186" y="84" width="110" height="6" rx="2"/>
    <rect x="186" y="96" width="100" height="6" rx="2"/>
    <rect x="186" y="108" width="116" height="6" rx="2"/>
    <rect x="186" y="120" width="80" height="6" rx="2"/>
  </g>
  <!-- The list-detail -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="80" height="110" rx="4" fill="none"/>
    <rect x="96" y="78" width="72" height="16" rx="3" stroke-width="1"/>
    <rect x="178" y="54" width="130" height="110" rx="4" fill="none"/>
  </g>
</svg>
