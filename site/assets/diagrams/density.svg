    <rect x="142" y="88.5" width="34" height="6" rx="2"/>
    <rect x="96" y="106.5" width="30" height="6" rx="2"/>
    <rect x="142" y="106.5" width="34" height="6" rx="2"/>
    <rect x="96" y="124.5" width="30" height="6" rx="2"/>
    <rect x="142" y="124.5" width="34" height="6" rx="2"/>
  </g>
  <!-- The compact density -->
