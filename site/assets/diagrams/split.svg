<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-split-title" aria-describedby="diagram-split-desc">
  <title id="diagram-split-title">Where a split is used</title>
  <desc id="diagram-split-desc">A split puts two regions side by side in the content area at a set ratio, such as an invoice and its payments at two to one.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="62" width="70" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="82" width="110" height="6" rx="2"/>
    <rect x="100" y="94" width="120" height="6" rx="2"/>
    <rect x="100" y="106" width="96" height="6" rx="2"/>
    <rect x="100" y="118" width="116" height="6" rx="2"/>
    <rect x="242" y="62" width="44" height="10" rx="2" fill-opacity=".6"/>
    <rect x="242" y="82" width="56" height="6" rx="2"/>
    <rect x="242" y="94" width="48" height="6" rx="2"/>
  </g>
  <!-- The split -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="140" height="110" rx="4" fill="none"/>
    <rect x="236" y="54" width="72" height="110" rx="4" fill="none"/>
  </g>
</svg>
