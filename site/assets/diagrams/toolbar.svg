<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-toolbar-title" aria-describedby="diagram-toolbar-desc">
  <title id="diagram-toolbar-title">Where a toolbar is used</title>
  <desc id="diagram-toolbar-desc">A toolbar is a row of related buttons at the top of the area it acts on, such as the formatting buttons above a text editor.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="88" width="180" height="6" rx="2"/>
    <rect x="100" y="100" width="160" height="6" rx="2"/>
    <rect x="100" y="112" width="190" height="6" rx="2"/>
    <rect x="100" y="124" width="100" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="92" y="78" width="216" height="84" rx="3"/>
  </g>
  <!-- The toolbar -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="216" height="22" rx="3"/>
    <rect x="98" y="58" width="16" height="14" rx="2" fill="var(--dui-color-accent)"/>
    <rect x="120" y="58" width="16" height="14" rx="2"/>
    <rect x="142" y="58" width="16" height="14" rx="2"/>
    <path d="M168 58v14" stroke-width="1"/>
    <rect x="174" y="58" width="30" height="14" rx="2"/>
    <rect x="210" y="58" width="30" height="14" rx="2"/>
  </g>
</svg>
