<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-stat-row-title" aria-describedby="diagram-stat-row-desc">
  <title id="diagram-stat-row-title">Where a stat row is used</title>
  <desc id="diagram-stat-row-desc">A row of small cards at the top of the content area, each with a label, a large number and a note.</desc>
  <!-- Frame -->
