  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="116" width="200" height="6" rx="2"/>
    <rect x="92" y="130" width="180" height="6" rx="2"/>
    <rect x="92" y="144" width="190" height="6" rx="2"/>
  </g>
  <!-- The a stat row -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="48" height="48" rx="4"/>
    <rect x="148" y="54" width="48" height="48" rx="4"/>
    <rect x="204" y="54" width="48" height="48" rx="4"/>
    <rect x="260" y="54" width="48" height="48" rx="4"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="98" y="62" width="24" height="4" rx="2"/>
    <rect x="154" y="62" width="24" height="4" rx="2"/>
    <rect x="210" y="62" width="24" height="4" rx="2"/>
    <rect x="266" y="62" width="24" height="4" rx="2"/>
    <rect x="98" y="72" width="30" height="8" rx="2"/>
    <rect x="154" y="72" width="30" height="8" rx="2"/>
    <rect x="210" y="72" width="30" height="8" rx="2"/>
    <rect x="266" y="72" width="30" height="8" rx="2"/>
    <rect x="98" y="88" width="20" height="4" rx="2" fill-opacity=".5"/>
    <rect x="154" y="88" width="20" height="4" rx="2" fill-opacity=".5"/>
    <rect x="210" y="88" width="20" height="4" rx="2" fill-opacity=".5"/>
    <rect x="266" y="88" width="20" height="4" rx="2" fill-opacity=".5"/>
