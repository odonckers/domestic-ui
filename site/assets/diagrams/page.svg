<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-page-title" aria-describedby="diagram-page-desc">
  <title id="diagram-page-title">Where the plain document page layout is used</title>
  <desc id="diagram-page-desc">A page with no app shell: its header, main and footer share one centered column with a gutter on each side, the header holding the brand and the site navigation.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M1 154.5h318"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="48" y="9" width="34" height="6" rx="2" fill-opacity=".6"/>
    <rect x="186" y="9" width="22" height="6" rx="2"/>
    <rect x="214" y="9" width="22" height="6" rx="2"/>
    <rect x="242" y="9" width="30" height="6" rx="2"/>
    <rect x="48" y="38" width="120" height="10" rx="2" fill-opacity=".6"/>
    <rect x="48" y="58" width="200" height="6" rx="2"/>
    <rect x="48" y="70" width="220" height="6" rx="2"/>
    <rect x="48" y="82" width="180" height="6" rx="2"/>
    <rect x="48" y="104" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="48" y="122" width="210" height="6" rx="2"/>
    <rect x="48" y="134" width="160" height="6" rx="2"/>
    <rect x="48" y="164" width="80" height="6" rx="2"/>
  </g>
  <!-- The column -->
  <g fill="none" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="40" y="4" width="240" height="172" rx="4"/>
  </g>
</svg>
