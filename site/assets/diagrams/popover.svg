<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-popover-title" aria-describedby="diagram-popover-desc">
  <title id="diagram-popover-title">Where popovers are used</title>
  <desc id="diagram-popover-desc">A popover opens from a button, such as Share beside the page heading, as a small panel on top of the page under the button.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="104" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="66" width="200" height="6" rx="2"/>
    <rect x="92" y="78" width="180" height="6" rx="2"/>
    <rect x="92" y="90" width="196" height="6" rx="2"/>
    <rect x="92" y="102" width="120" height="6" rx="2"/>
    <rect x="92" y="126" width="190" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="256" y="32" width="52" height="18" rx="3"/>
  </g>
  <!-- The popovers -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="188" y="56" width="120" height="54" rx="4" fill="var(--dui-color-surface)"/>
    <path d="M276 50l6 6h-12z" fill="var(--dui-color-surface)"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="198" y="68" width="90" height="6" rx="2"/>
    <rect x="198" y="80" width="70" height="6" rx="2"/>
    <rect x="198" y="92" width="80" height="6" rx="2"/>
  </g>
</svg>
