<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-search-dialog-title" aria-describedby="diagram-search-dialog-desc">
  <title id="diagram-search-dialog-title">Where a search dialog is used</title>
  <desc id="diagram-search-dialog-desc">A search dialog opens from the Search button in the app bar, over the dimmed page, with a field and its list of results.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="160" height="6" rx="2"/>
  </g>
  <!-- The Search button in the app bar -->
  <rect x="230" y="6" width="50" height="12" rx="3" fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2"/>
  <!-- Backdrop -->
  <rect x="1.5" y="1.5" width="317" height="177" rx="5" fill="var(--dui-color-backdrop)"/>
  <!-- The dialog: heading, field and results -->
  <g fill="var(--dui-color-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="80" y="30" width="160" height="120" rx="4"/>
    <rect x="90" y="56" width="140" height="16" rx="3" fill="var(--dui-color-accent-surface)"/>
    <rect x="90" y="76" width="140" height="64" rx="3"/>
  </g>
  <g fill="var(--dui-color-accent)">
    <rect x="90" y="40" width="40" height="8" rx="2"/>
    <rect x="96" y="61" width="30" height="6" rx="2"/>
    <rect x="96" y="84" width="80" height="6" rx="2"/>
    <rect x="96" y="98" width="100" height="6" rx="2"/>
    <rect x="96" y="112" width="70" height="6" rx="2"/>
    <rect x="96" y="126" width="90" height="6" rx="2"/>
  </g>
</svg>
