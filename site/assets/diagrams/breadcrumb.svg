<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-breadcrumb-title" aria-describedby="diagram-breadcrumb-desc">
  <title id="diagram-breadcrumb-title">Where the breadcrumb is used</title>
  <desc id="diagram-breadcrumb-desc">The breadcrumb is the row of links above the page heading in the content area, from the top section to the current page.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="54" width="120" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="76" width="200" height="6" rx="2"/>
    <rect x="92" y="88" width="180" height="6" rx="2"/>
    <rect x="92" y="100" width="196" height="6" rx="2"/>
    <rect x="92" y="124" width="190" height="6" rx="2"/>
    <rect x="92" y="136" width="160" height="6" rx="2"/>
  </g>
  <!-- The breadcrumb -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <path d="M132 35l3 3-3 3M178 35l3 3-3 3" fill="none" stroke-width="1.5"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="92" y="35" width="34" height="6" rx="2"/>
    <rect x="140" y="35" width="32" height="6" rx="2"/>
    <rect x="186" y="35" width="40" height="6" rx="2"/>
  </g>
</svg>
