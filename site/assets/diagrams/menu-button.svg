<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-menu-button-title" aria-describedby="diagram-menu-button-desc">
  <title id="diagram-menu-button-title">Where a menu button is used</title>
  <desc id="diagram-menu-button-desc">A menu button is the Actions button at the end of a table row, opening a list of actions under it.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
    <path d="M92 70.5h216M92 86.5h216M92 102.5h216M92 118.5h216M92 134.5h216M92 150.5h216"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="96" y="60" width="28" height="6" rx="2"/>
    <rect x="178" y="60" width="28" height="6" rx="2"/>
    <rect x="96" y="75.5" width="34" height="6" rx="2"/>
    <rect x="178" y="75.5" width="44" height="6" rx="2"/>
    <rect x="96" y="91.5" width="34" height="6" rx="2"/>
    <rect x="178" y="91.5" width="44" height="6" rx="2"/>
    <rect x="96" y="107.5" width="34" height="6" rx="2"/>
    <rect x="178" y="107.5" width="44" height="6" rx="2"/>
    <rect x="96" y="123.5" width="34" height="6" rx="2"/>
    <rect x="178" y="123.5" width="44" height="6" rx="2"/>
    <rect x="96" y="139.5" width="34" height="6" rx="2"/>
    <rect x="178" y="139.5" width="44" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="268" y="72.5" width="36" height="12" rx="3"/>
    <rect x="268" y="104.5" width="36" height="12" rx="3"/>
    <rect x="268" y="120.5" width="36" height="12" rx="3"/>
    <rect x="268" y="136.5" width="36" height="12" rx="3"/>
  </g>
  <!-- The menu button -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="268" y="88.5" width="36" height="12" rx="3"/>
    <rect x="232" y="103.5" width="76" height="56" rx="4" fill="var(--dui-color-surface)"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="240" y="111.5" width="40" height="6" rx="2"/>
    <rect x="240" y="123.5" width="50" height="6" rx="2"/>
    <rect x="240" y="135.5" width="36" height="6" rx="2"/>
    <rect x="240" y="147.5" width="34" height="6" rx="2"/>
  </g>
</svg>
