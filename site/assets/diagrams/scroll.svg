    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="104" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="62" width="50" height="6" rx="2"/>
    <rect x="180" y="62" width="56" height="6" rx="2"/>
    <rect x="264" y="62" width="44" height="6" rx="2"/>
    <rect x="100" y="78" width="50" height="6" rx="2"/>
    <rect x="180" y="78" width="56" height="6" rx="2"/>
    <rect x="264" y="78" width="44" height="6" rx="2"/>
    <rect x="100" y="94" width="50" height="6" rx="2"/>
    <rect x="180" y="94" width="56" height="6" rx="2"/>
    <rect x="264" y="94" width="44" height="6" rx="2"/>
    <rect x="100" y="110" width="50" height="6" rx="2"/>
    <rect x="180" y="110" width="56" height="6" rx="2"/>
    <rect x="264" y="110" width="44" height="6" rx="2"/>
    <rect x="100" y="126" width="50" height="6" rx="2"/>
    <rect x="180" y="126" width="56" height="6" rx="2"/>
