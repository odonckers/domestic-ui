<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-dialog-title" aria-describedby="diagram-dialog-desc">
  <title id="diagram-dialog-title">Where the dialog and drawer are used</title>
  <desc id="diagram-dialog-desc">A modal dialog sits centred over the dimmed page; a drawer takes the same place along one edge of the window.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="200" height="6" rx="2"/>
    <rect x="92" y="66" width="180" height="6" rx="2"/>
    <rect x="92" y="78" width="196" height="6" rx="2"/>
    <rect x="92" y="150" width="160" height="6" rx="2"/>
  </g>
  <!-- Backdrop -->
  <g fill="var(--dui-color-backdrop)">
    <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6"/>
  </g>
  <!-- The dialog and drawer -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="90" y="40" width="140" height="100" rx="6" fill="var(--dui-color-surface)"/>
    <rect x="178" y="112" width="40" height="16" rx="3" fill="var(--dui-color-accent)"/>
    <rect x="132" y="112" width="40" height="16" rx="3"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="102" y="52" width="70" height="8" rx="2"/>
    <rect x="102" y="70" width="110" height="6" rx="2"/>
    <rect x="102" y="82" width="96" height="6" rx="2"/>
  </g>
</svg>
