<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-account-menu-title" aria-describedby="diagram-account-menu-desc">
  <title id="diagram-account-menu-title">Where an account menu is used</title>
  <desc id="diagram-account-menu-desc">An account menu opens from the person's name at the end of the header, with their name and email, account links and a sign-out button.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
  </g>
  <!-- The an account menu -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="252" y="6" width="60" height="13" rx="3"/>
    <rect x="216" y="28" width="96" height="96" rx="4"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="258" y="10" width="40" height="5" rx="2"/>
    <rect x="224" y="36" width="50" height="5" rx="2"/>
    <rect x="224" y="46" width="70" height="4" rx="2" fill-opacity=".5"/>
    <rect x="222" y="56" width="84" height="1.5"/>
    <rect x="224" y="64" width="40" height="4" rx="2"/>
    <rect x="224" y="76" width="36" height="4" rx="2"/>
    <rect x="224" y="88" width="44" height="4" rx="2"/>
    <rect x="222" y="98" width="84" height="1.5"/>
    <rect x="224" y="108" width="40" height="4" rx="2"/>
  </g>
</svg>