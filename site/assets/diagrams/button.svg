<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-button-title" aria-describedby="diagram-button-desc">
  <title id="diagram-button-title">Where buttons are used</title>
  <desc id="diagram-button-desc">Buttons sit at the end of a form in the content area: the primary submit button first, with a secondary button beside it.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="56" width="40" height="6" rx="2"/>
    <rect x="92" y="92" width="56" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="92" y="66" width="160" height="16" rx="3"/>
    <rect x="92" y="102" width="160" height="16" rx="3"/>
  </g>
  <!-- The buttons -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="134" width="56" height="22" rx="4" fill="var(--dui-color-accent)"/>
    <rect x="156" y="134" width="56" height="22" rx="4"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="106" y="142" width="28" height="6" rx="2" fill="var(--dui-color-surface)"/>
    <rect x="170" y="142" width="28" height="6" rx="2"/>
  </g>
</svg>
