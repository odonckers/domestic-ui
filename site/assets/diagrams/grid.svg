<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-grid-title" aria-describedby="diagram-grid-desc">
  <title id="diagram-grid-title">Where a grid is used</title>
  <desc id="diagram-grid-desc">A grid lays out cards or panels in the content area in as many equal columns as fit, here three columns and two rows.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="64" width="40" height="6" rx="2"/>
    <rect x="100" y="116" width="44" height="6" rx="2"/>
    <rect x="172" y="64" width="40" height="6" rx="2"/>
    <rect x="172" y="116" width="44" height="6" rx="2"/>
    <rect x="244" y="64" width="40" height="6" rx="2"/>
    <rect x="244" y="116" width="44" height="6" rx="2"/>
  </g>
  <!-- The grid -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="56" width="64" height="44" rx="4"/>
    <rect x="92" y="108" width="64" height="44" rx="4"/>
    <rect x="164" y="56" width="64" height="44" rx="4"/>
    <rect x="164" y="108" width="64" height="44" rx="4"/>
    <rect x="236" y="56" width="64" height="44" rx="4"/>
    <rect x="236" y="108" width="64" height="44" rx="4"/>
  </g>
</svg>
