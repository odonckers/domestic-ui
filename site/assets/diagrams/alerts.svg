<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-alerts-title" aria-describedby="diagram-alerts-desc">
  <title id="diagram-alerts-title">Where alerts are used</title>
  <desc id="diagram-alerts-desc">An alert is a notice at the top of the content area under the heading, and a toast appears in the bottom corner at the end of the window.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="82" width="200" height="6" rx="2"/>
    <rect x="92" y="94" width="180" height="6" rx="2"/>
    <rect x="92" y="106" width="196" height="6" rx="2"/>
    <rect x="92" y="118" width="120" height="6" rx="2"/>
  </g>
  <!-- The alerts -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="52" width="216" height="22" rx="3"/>
    <rect x="212" y="140" width="98" height="30" rx="4"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="92" y="52" width="4" height="22"/>
    <rect x="104" y="60" width="120" height="6" rx="2"/>
    <rect x="222" y="152" width="60" height="6" rx="2"/>
  </g>
</svg>
