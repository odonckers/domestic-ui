<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-people-list-title" aria-describedby="diagram-people-list-desc">
  <title id="diagram-people-list-title">Where a people list is used</title>
  <desc id="diagram-people-list-desc">A people list sits in a card in the content area, one row per person with their name and email and a role badge at the end.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
  </g>
  <!-- The a people list -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="208" height="96" rx="4"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="104" y="64" width="56" height="6" rx="2"/>
    <rect x="104" y="74" width="80" height="4" rx="2" fill-opacity=".5"/>
    <rect x="262" y="65" width="26" height="10" rx="5" fill-opacity=".35"/>
    <rect x="104" y="90" width="56" height="6" rx="2"/>
    <rect x="104" y="100" width="80" height="4" rx="2" fill-opacity=".5"/>
    <rect x="262" y="91" width="26" height="10" rx="5" fill-opacity=".35"/>
    <rect x="104" y="116" width="56" height="6" rx="2"/>
    <rect x="104" y="126" width="80" height="4" rx="2" fill-opacity=".5"/>
    <rect x="262" y="117" width="26" height="10" rx="5" fill-opacity=".35"/>
  </g>
</svg>