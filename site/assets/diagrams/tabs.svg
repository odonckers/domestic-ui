<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-tabs-title" aria-describedby="diagram-tabs-desc">
  <title id="diagram-tabs-title">Where tabs are used</title>
  <desc id="diagram-tabs-desc">Tabs are a row of labels under a heading in the content area, with the panel of the selected tab right below them.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="102" y="82" width="170" height="6" rx="2"/>
    <rect x="102" y="94" width="150" height="6" rx="2"/>
    <rect x="102" y="106" width="180" height="6" rx="2"/>
    <rect x="102" y="118" width="120" height="6" rx="2"/>
  </g>
  <!-- The tabs -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="72" width="216" height="92" rx="3" fill="none"/>
    <rect x="92" y="54" width="56" height="18" rx="3"/>
    <path d="M156 72V54h50v18M214 72V54h50v18" fill="none" stroke-width="1"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="104" y="60" width="32" height="6" rx="2"/>
    <rect x="166" y="60" width="30" height="6" rx="2"/>
    <rect x="224" y="60" width="30" height="6" rx="2"/>
  </g>
</svg>
