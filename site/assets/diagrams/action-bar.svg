<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-action-bar-title" aria-describedby="diagram-action-bar-desc">
  <title id="diagram-action-bar-title">Where the action bar is used</title>
  <desc id="diagram-action-bar-desc">The action bar is a sticky strip at the bottom of the window under a long form, holding its Save and Cancel buttons.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="96" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="40" height="6" rx="2"/>
    <rect x="92" y="90" width="52" height="6" rx="2"/>
    <rect x="92" y="126" width="36" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="92" y="64" width="150" height="16" rx="3"/>
    <rect x="92" y="100" width="150" height="16" rx="3"/>
    <rect x="92" y="136" width="150" height="8" rx="3"/>
  </g>
  <!-- The action bar -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="80" y="148" width="236" height="28" rx="3"/>
    <rect x="208" y="154" width="46" height="16" rx="3"/>
    <rect x="260" y="154" width="48" height="16" rx="3"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="220" y="159" width="22" height="6" rx="2"/>
    <rect x="270" y="159" width="28" height="6" rx="2"/>
  </g>
</svg>
