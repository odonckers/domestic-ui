<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-visually-hidden-title" aria-describedby="diagram-visually-hidden-desc">
  <title id="diagram-visually-hidden-title">Where visually hidden text is used</title>
  <desc id="diagram-visually-hidden-desc">Visually hidden text names an icon-only button, such as the close button of a panel, for screen readers without showing on screen.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
    <path d="M216.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="104" height="6" rx="2"/>
    <rect x="92" y="66" width="96" height="6" rx="2"/>
    <rect x="92" y="78" width="108" height="6" rx="2"/>
    <rect x="228" y="64" width="56" height="10" rx="2" fill-opacity=".6"/>
    <rect x="228" y="84" width="76" height="6" rx="2"/>
    <rect x="228" y="96" width="64" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="292" y="34" width="18" height="18" rx="3"/>
    <path d="M297 39l8 8M305 39l-8 8"/>
  </g>
  <!-- The visually hidden text -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="226" y="35" width="60" height="16" rx="3" fill="none" stroke-dasharray="4 3"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="232" y="40" width="48" height="6" rx="2"/>
  </g>
</svg>
