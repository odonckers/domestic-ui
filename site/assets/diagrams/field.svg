<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-field-title" aria-describedby="diagram-field-desc">
  <title id="diagram-field-title">Where a field is used</title>
  <desc id="diagram-field-desc">A field is one form entry in the content area: the label, the control, then a hint and an error message under it.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="40" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="92" y="64" width="180" height="16" rx="3"/>
  </g>
  <!-- The field -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="88" y="88" width="192" height="64" rx="4" fill="none" stroke-dasharray="4 3"/>
    <rect x="96" y="106" width="172" height="14" rx="3"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="96" y="96" width="46" height="6" rx="2"/>
    <rect x="96" y="126" width="110" height="6" rx="2" fill-opacity=".6"/>
    <rect x="96" y="138" width="90" height="6" rx="2"/>
  </g>
</svg>
