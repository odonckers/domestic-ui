<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-cluster-title" aria-describedby="diagram-cluster-desc">
  <title id="diagram-cluster-title">Where a cluster is used</title>
  <desc id="diagram-cluster-desc">A cluster is a row of buttons, tags or nav links under a heading that wraps onto a second line when the row is full.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="110" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="180" height="6" rx="2"/>
    <rect x="92" y="66" width="150" height="6" rx="2"/>
    <rect x="92" y="132" width="190" height="6" rx="2"/>
    <rect x="92" y="144" width="160" height="6" rx="2"/>
  </g>
  <!-- The cluster -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="88" y="80" width="196" height="44" rx="4" fill="none" stroke-dasharray="4 3"/>
    <rect x="94" y="86" width="40" height="14" rx="7"/>
    <rect x="140" y="86" width="52" height="14" rx="7"/>
    <rect x="198" y="86" width="30" height="14" rx="7"/>
    <rect x="234" y="86" width="44" height="14" rx="7"/>
    <rect x="94" y="104" width="48" height="14" rx="7"/>
    <rect x="148" y="104" width="36" height="14" rx="7"/>
  </g>
</svg>
