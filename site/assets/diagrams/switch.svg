<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-switch-title" aria-describedby="diagram-switch-desc">
  <title id="diagram-switch-title">Where switches are used</title>
  <desc id="diagram-switch-desc">Switches sit at the start of each row in a settings fieldset, each turning one option on or off, with its label beside it.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="80" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="62" width="44" height="6" rx="2"/>
    <rect x="136" y="84" width="70" height="6" rx="2"/>
    <rect x="136" y="108" width="92" height="6" rx="2"/>
    <rect x="136" y="132" width="60" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="92" y="54" width="200" height="100" rx="4"/>
  </g>
  <!-- The switches -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="104" y="81" width="24" height="12" rx="6"/>
    <rect x="104" y="105" width="24" height="12" rx="6"/>
    <rect x="104" y="129" width="24" height="12" rx="6"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <circle cx="122" cy="87" r="4"/>
    <circle cx="110" cy="111" r="4"/>
    <circle cx="122" cy="135" r="4"/>
  </g>
</svg>
