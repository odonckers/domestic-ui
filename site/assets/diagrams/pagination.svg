  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="56" width="120" height="6" rx="2"/>
    <rect x="240" y="56" width="40" height="6" rx="2"/>
    <rect x="92" y="72" width="120" height="6" rx="2"/>
    <rect x="240" y="72" width="40" height="6" rx="2"/>
    <rect x="92" y="88" width="120" height="6" rx="2"/>
    <rect x="240" y="88" width="40" height="6" rx="2"/>
    <rect x="92" y="104" width="120" height="6" rx="2"/>
    <rect x="240" y="104" width="40" height="6" rx="2"/>
    <rect x="92" y="120" width="120" height="6" rx="2"/>
    <rect x="240" y="120" width="40" height="6" rx="2"/>
  </g>
  <!-- The pagination -->
