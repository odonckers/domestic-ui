<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-nav-title" aria-describedby="diagram-nav-desc">
  <title id="diagram-nav-title">Where site navigation is used</title>
  <desc id="diagram-nav-desc">Site navigation is the list of main links in the sidebar, with the current page marked, or a short row of links in the app bar.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="92" y="36" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="56" width="200" height="6" rx="2"/>
    <rect x="92" y="68" width="180" height="6" rx="2"/>
    <rect x="92" y="80" width="196" height="6" rx="2"/>
    <rect x="92" y="104" width="190" height="6" rx="2"/>
    <rect x="92" y="116" width="160" height="6" rx="2"/>
  </g>
  <!-- The site navigation -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="6" y="32" width="64" height="92" rx="4" fill="none"/>
    <rect x="10" y="64" width="56" height="14" rx="3" fill="var(--dui-color-accent)" stroke="none"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="14" y="40" width="44" height="6" rx="2"/>
    <rect x="14" y="54" width="36" height="6" rx="2"/>
    <rect x="14" y="68" width="40" height="6" rx="2" fill="var(--dui-color-surface)"/>
    <rect x="14" y="84" width="40" height="6" rx="2"/>
    <rect x="14" y="98" width="46" height="6" rx="2"/>
    <rect x="14" y="112" width="34" height="6" rx="2"/>
    <rect x="222" y="9" width="24" height="6" rx="2"/>
    <rect x="254" y="9" width="24" height="6" rx="2"/>
    <rect x="286" y="9" width="24" height="6" rx="2"/>
  </g>
</svg>
