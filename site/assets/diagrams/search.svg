<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-search-title" aria-describedby="diagram-search-desc">
  <title id="diagram-search-title">Where search is used</title>
  <desc id="diagram-search-desc">Site search sits in the app bar as a search input with a Search button; a labelled search form can also head a page of results.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="36" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="56" width="200" height="6" rx="2"/>
    <rect x="92" y="68" width="180" height="6" rx="2"/>
    <rect x="92" y="92" width="190" height="6" rx="2"/>
    <rect x="92" y="104" width="140" height="6" rx="2"/>
  </g>
  <!-- The search -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="176" y="6" width="92" height="13" rx="3"/>
    <rect x="272" y="6" width="38" height="13" rx="3"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="282" y="9.5" width="20" height="6" rx="2"/>
  </g>
</svg>
