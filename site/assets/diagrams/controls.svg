<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-controls-title" aria-describedby="diagram-controls-desc">
  <title id="diagram-controls-title">Where form controls are used</title>
  <desc id="diagram-controls-desc">Form controls are the inputs of a form in the content area: text fields, a select, and checkboxes in a fieldset, each under its label.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="92" y="54" width="40" height="6" rx="2"/>
    <rect x="204" y="54" width="36" height="6" rx="2"/>
    <rect x="100" y="100" width="50" height="6" rx="2"/>
    <rect x="114" y="118" width="60" height="6" rx="2"/>
    <rect x="114" y="136" width="52" height="6" rx="2"/>
  </g>
  <!-- Other controls -->
  <g fill="none" stroke="currentColor" stroke-opacity=".5">
    <rect x="92" y="94" width="200" height="58" rx="4"/>
  </g>
  <!-- The form controls -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="64" width="104" height="16" rx="3"/>
    <rect x="204" y="64" width="104" height="16" rx="3"/>
    <path d="M296 70l-4 4-4-4" fill="none"/>
    <rect x="100" y="115" width="10" height="10" rx="2"/>
    <rect x="100" y="133" width="10" height="10" rx="2"/>
  </g>
</svg>
