<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-disclosure-title" aria-describedby="diagram-disclosure-desc">
  <title id="diagram-disclosure-title">Where disclosures are used</title>
  <desc id="diagram-disclosure-desc">Disclosures are summary rows in the content area, such as an accordion of questions, that each open to show their content below.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="100" height="10" rx="2" fill-opacity=".6"/>
    <rect x="108" y="78" width="170" height="6" rx="2"/>
    <rect x="108" y="90" width="150" height="6" rx="2"/>
    <rect x="108" y="102" width="160" height="6" rx="2"/>
  </g>
  <!-- The disclosures -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="216" height="18" rx="3"/>
    <rect x="92" y="114" width="216" height="18" rx="3"/>
    <rect x="92" y="138" width="216" height="18" rx="3"/>
    <path d="M98 60l4 4 4-4M99 120l4 3-4 3M99 144l4 3-4 3" fill="none" stroke-width="1.5"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="112" y="60" width="90" height="6" rx="2"/>
    <rect x="112" y="120" width="120" height="6" rx="2"/>
    <rect x="112" y="144" width="80" height="6" rx="2"/>
  </g>
</svg>
