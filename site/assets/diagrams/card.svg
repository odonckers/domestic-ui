<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="diagram-card-title" aria-describedby="diagram-card-desc">
  <title id="diagram-card-title">Where cards are used</title>
  <desc id="diagram-card-desc">Cards sit in a grid in the content area, each a raised box with a heading link and a short text.</desc>
  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="178.5" rx="6" fill="var(--dui-color-surface)" stroke="var(--dui-color-border)" stroke-width="1.5"/>
  <!-- Regions -->
  <g fill="none" stroke="currentColor" stroke-opacity=".35">
    <path d="M1 24.5h318M76.5 24.5V179"/>
  </g>
  <!-- Text -->
  <g fill="currentColor" fill-opacity=".3">
    <rect x="10" y="9" width="34" height="6" rx="2"/>
    <rect x="12" y="38" width="44" height="6" rx="2"/>
    <rect x="12" y="52" width="36" height="6" rx="2"/>
    <rect x="12" y="66" width="50" height="6" rx="2"/>
    <rect x="12" y="80" width="40" height="6" rx="2"/>
    <rect x="12" y="94" width="46" height="6" rx="2"/>
    <rect x="92" y="34" width="90" height="10" rx="2" fill-opacity=".6"/>
    <rect x="100" y="106" width="44" height="6" rx="2"/>
    <rect x="100" y="118" width="36" height="6" rx="2"/>
    <rect x="172" y="106" width="44" height="6" rx="2"/>
    <rect x="172" y="118" width="36" height="6" rx="2"/>
    <rect x="244" y="106" width="44" height="6" rx="2"/>
    <rect x="244" y="118" width="36" height="6" rx="2"/>
  </g>
  <!-- The cards -->
  <g fill="var(--dui-color-accent-surface)" stroke="var(--dui-color-accent)" stroke-width="2">
    <rect x="92" y="54" width="64" height="96" rx="4"/>
    <rect x="164" y="54" width="64" height="96" rx="4"/>
    <rect x="236" y="54" width="64" height="96" rx="4"/>
  </g>
  <!-- Its text -->
  <g fill="var(--dui-color-accent)">
    <rect x="100" y="62" width="48" height="32" rx="2" fill-opacity=".25"/>
    <rect x="172" y="62" width="48" height="32" rx="2" fill-opacity=".25"/>
    <rect x="244" y="62" width="48" height="32" rx="2" fill-opacity=".25"/>
    <rect x="100" y="98" width="40" height="4" rx="2"/>
    <rect x="172" y="98" width="40" height="4" rx="2"/>
    <rect x="244" y="98" width="40" height="4" rx="2"/>
  </g>
</svg>
