# git-cliff configuration: https://git-cliff.org/docs/configuration
# Run through scripts/changelog.mjs (`npm run changelog`), which limits the range to
# commits after the switch to Conventional Commits and keeps the hand-written history.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Semantic token names and file paths under `css/` are public API; primitive tokens are not.

This file is generated by `npm run changelog` from the Conventional Commits on `main`. Do not edit it by hand.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/odonckers/domestic-ui/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### ⚠ Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
  {%- if commit.breaking_description and commit.breaking_description != commit.message %}. {{ commit.breaking_description }}{% endif %}
{%- endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The squash-merge suffix "(#N)" links to the pull request.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/odonckers/domestic-ui/pull/${1}))" },
]
# Matching is case-sensitive, so the old "Docs: …" and "demos: …" subjects never
# match. The HTML comments order the sections and are stripped from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^(refactor|perf|style)", group = "<!-- 2 -->Changed" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^revert", group = "<!-- 4 -->Other" },
  # chore, ci, test, build and anything else are left out, unless breaking.
  { message = "^(chore|ci|test|build)", group = "<!-- 4 -->Other", skip = true },
  { message = ".*", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
