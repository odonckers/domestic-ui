<h1>Account settings</h1>
<p data-text="lead">Update your profile and choose how Homebase keeps you in the loop.</p>

<form class="stack" style="--stack-gap: var(--dui-space-l)" method="get">
  <fieldset>
    <legend>Profile</legend>
    <div class="grid" style="--grid-min: 14rem">
      <div data-field>
        <label for="given-name">First name</label>
        <input id="given-name" name="given-name" type="text" autocomplete="given-name">
      </div>
      <div data-field>
        <label for="family-name">Last name</label>
        <input id="family-name" name="family-name" type="text" autocomplete="family-name">
      </div>
      <div data-field>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div data-field>
        <label for="tel">Phone</label>
        <input id="tel" name="tel" type="tel" autocomplete="tel">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Region</legend>
    <div class="grid" style="--grid-min: 14rem">
      <div data-field>
        <label for="language">Language</label>
        <select id="language" name="language" autocomplete="language">
          <option value="en" selected>English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="nl">Nederlands</option>
        </select>
      </div>
      <div data-field>
        <label for="time-zone">Time zone</label>
        <select id="time-zone" name="time-zone">
          <option value="America/Los_Angeles">Pacific Time</option>
          <option value="America/Denver">Mountain Time</option>
          <option value="America/Chicago" selected>Central Time</option>
          <option value="America/New_York">Eastern Time</option>
        </select>
      </div>
    </div>
  </fieldset>

  <div class="grid" style="--grid-min: 14rem">
    <fieldset>
      <legend>Email me</legend>
      <label><input type="radio" name="frequency" value="immediately"> Right away</label>
      <label><input type="radio" name="frequency" value="daily" checked> Once a day</label>
      <label><input type="radio" name="frequency" value="weekly"> Once a week</label>
      <label><input type="radio" name="frequency" value="never"> Never</label>
    </fieldset>
    <fieldset>
      <legend>Notify me about</legend>
      <label><input type="checkbox" role="switch" name="notify-assigned" checked> Chores assigned to me</label>
      <label><input type="checkbox" role="switch" name="notify-overdue" checked> Overdue chores</label>
      <label><input type="checkbox" role="switch" name="notify-members"> New household members</label>
    </fieldset>
  </div>

  <fieldset>
    <legend>About you</legend>
    <div data-field>
      <label for="bio">Note for your household</label>
      <textarea id="bio" name="bio" rows="3" maxlength="200" aria-describedby="bio-hint"></textarea>
      <p id="bio-hint" data-field="hint">Shown on the household page. Up to 200 characters.</p>
    </div>
  </fieldset>

  <div class="cluster">
    <button type="submit" data-button="primary">Save changes</button>
    <button type="reset" data-button="quiet">Reset</button>
  </div>
</form>
