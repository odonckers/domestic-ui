<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Northwind</title>
    <meta name="description" content="A sign-in page: one card centered on the page, laid out from its landmarks with no CSS of its own.">
    <link rel="stylesheet" href="../../css/domestic.css">
  </head>
  <body>
    <!-- dui:snippet name="Sign-in page" page="layouts/page" -->
    <main id="main">
      <article data-card aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">Sign in to Northwind</h1>
        <p data-text="muted">Welcome back. Enter your details to continue.</p>
        <form class="stack" method="post" action="#sign-in">
          <div data-field>
            <label for="sign-in-email">Email</label>
            <input type="email" id="sign-in-email" name="email" autocomplete="email" required>
          </div>
          <div data-field>
            <label for="sign-in-password">Password</label>
            <input type="password" id="sign-in-password" name="password" autocomplete="current-password" required>
          </div>
          <label><input type="checkbox" name="remember"> Remember me on this device</label>
          <button type="submit" data-button="primary">Sign in</button>
        </form>
        <footer>
          <p data-text="small"><a href="#reset">Forgot your password?</a></p>
          <p data-text="small">New to Northwind? <a href="#sign-up">Create an account</a></p>
        </footer>
      </article>
    </main>
    <!-- /dui:snippet -->
  </body>
</html>
