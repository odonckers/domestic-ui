name: Bug report
description: Report a problem with an element or component
labels: [bug]
body:
  - type: input
    id: element
    attributes:
      label: Element or component
      description: Which element or component is affected?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, and OS if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility impact
      options:
        - label: This bug affects accessibility
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, markup, or a link that shows the problem.
