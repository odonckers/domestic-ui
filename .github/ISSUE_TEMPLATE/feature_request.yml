name: Feature request
description: Propose a new element, component, or behavior
labels: [enhancement]
body:
  - type: input
    id: element
    attributes:
      label: Element or component
      description: Which element or component is this about? Use the native element name when you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What and why
      description: What should change, and why is it needed?
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec link
      description: Link to the relevant MDN, WHATWG, W3C, WCAG 2.2, or APG documentation.
      placeholder: https://
    validations:
      required: true
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility impact
      options:
        - label: This feature affects accessibility
