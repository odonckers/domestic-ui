name: Owen approval gate

# Retired: outside pull requests no longer need an approval label. They get
# the same review and CI as every other pull request.
#
# The "Protect main" ruleset still lists `owen-gate` as a required check, so
# this job stays and always passes until that check is removed from the
# ruleset. Delete this file in the same change that removes it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  owen-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: echo "No approval label is needed; review and CI decide."
