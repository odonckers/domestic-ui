# Builds the docs site with site/build.mjs and deploys it to GitHub Pages.
# The build has zero dependencies, so there is no npm install step.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Fails if README.md, llms.txt or llms-full.txt were not regenerated.
      - name: Check generated files are up to date
        run: node site/build.mjs --check

      # Writes _site/ (pages, Markdown twins, copied css/ and examples/, .nojekyll).
      - name: Build site
        run: node site/build.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
