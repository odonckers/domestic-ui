name: CI

on:
  pull_request:
    # `edited` re-runs CI when a pull request is retitled, so commitlint in
    # the `lint` job sees the title that becomes the squash commit on main.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# An `edited` run (title, description or base change) queues behind a run in
# progress instead of cancelling it; new commits still cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

# The Playwright shards run in Playwright's image, which ships Chromium,
# Firefox, WebKit and their system dependencies; that saves the ~11 minute apt
# install of `npx playwright install --with-deps`, so no job downloads
# browsers. Keep the tag equal to the @playwright/test version in
# package.json; bump them together. https://playwright.dev/docs/ci#via-containers

jobs:
  # Lint, the generated-files check and, on pull requests, Conventional Commits
  # (commitlint.config.mjs, CONTRIBUTING.md): the pull request title, which
  # becomes the squash commit on main, and every commit in the pull request.
  # Merge commits are ignored. No browser is needed, so no container: that saves
  # the image start-up, and one job instead of two frees a runner for the shards.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint reads every commit between the base and the head. The
          # string '0' is truthy; a bare 0 would fall through to 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint:html
      - run: npm run lint:css
      - run: npm run lint:tokens
      - run: npm run lint:deps
      - name: Generated README.md and llms files are up to date
        run: node site/build.mjs --check
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
      - name: Commits in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

  playwright:
    name: playwright (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      # Every test still runs once: Playwright splits all projects (Chromium,
      # Firefox, WebKit) and specs across the shards.
      # https://playwright.dev/docs/test-sharding
      # Our choice: 4 shards of 4 workers (a hosted runner has 4 CPUs) rather
      # than 8 shards of 2. Same parallelism, half the runners, so runs from
      # other pull requests wait less for a free runner.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright test --workers=4 --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The "Protect main" ruleset requires a check named exactly `ci`. This job
  # reports it, and passes only when lint and every Playwright shard passed.
  ci:
    name: ci
    if: always()
    needs: [lint, playwright]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
        run: |
          echo "lint: $LINT; playwright: $PLAYWRIGHT"
          [ "$LINT" = success ] || exit 1
          [ "$PLAYWRIGHT" = success ] || exit 1
