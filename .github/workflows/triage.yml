name: Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-outside:
    runs-on: ubuntu-latest
    steps:
      - name: Add needs-owen-approval to outside items
        uses: actions/github-script@v7
        with:
          script: |
            const association =
              (context.payload.issue && context.payload.issue.author_association) ||
              (context.payload.pull_request && context.payload.pull_request.author_association);
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            if (trusted.has(association)) {
              return;
            }
            const number =
              (context.payload.pull_request && context.payload.pull_request.number) ||
              (context.payload.issue && context.payload.issue.number);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: ["needs-owen-approval"],
            });
